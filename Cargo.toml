 [package]
name = "linux_forge"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
rfd = "0.14"
walkdir = "2.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
flate2 = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
