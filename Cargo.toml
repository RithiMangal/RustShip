[package]
name = "invisible-secrets"
version = "2.0.0"
edition = "2021"
description = "Carrier-safe file embedding/extraction utility"

[dependencies]
eframe = "0.29"
rfd = "0.15"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
